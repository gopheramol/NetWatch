services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: netwatch-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - netwatch-data:/app/data
      - ./configs:/app/configs:ro
    environment:
      - NETWATCH_TELEGRAM_ENABLED=${TELEGRAM_ENABLED:-false}
      - NETWATCH_TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - NETWATCH_TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080}
    container_name: netwatch-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_OPTIONS=--max-old-space-size=512
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      - backend

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: netwatch-tunnel
    restart: unless-stopped
    command: tunnel --url http://frontend:3000
    deploy:
      resources:
        limits:
          memory: 128M
    depends_on:
      - frontend

volumes:
  netwatch-data:
