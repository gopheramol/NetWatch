server:
  port: 8080
  host: "0.0.0.0"
  shutdown_timeout: 10s
  cors_origins:
    - "*"

database:
  path: "./data/netwatch.db"

telegram:
  enabled: false
  bot_token: ""
  chat_id: ""

monitor:
  interval_seconds: 15
  http_check_url: "https://google.com"
  ping_host: "8.8.8.8"
  dns_host: "google.com"
  timeout_seconds: 5
  failure_threshold: 2

speedtest:
  interval_hours: 6
  provider: "ookla"

retention:
  raw_data_days: 90
  cleanup_interval: 24h

logging:
  level: "info"
  path: ""
