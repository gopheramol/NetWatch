server:
  port: 8080
  host: "0.0.0.0"
  shutdown_timeout: 10s
  cors_origins:
    - "*"

database:
  path: "./data/netwatch.db"

telegram:
  enabled: false
  bot_token: ""
  chat_id: ""

monitor:
  interval_seconds: 15
  http_check_url: "https://google.com"
  ping_host: "8.8.8.8"
  dns_host: "google.com"
  timeout_seconds: 5
  failure_threshold: 2
  # Consecutive checks with latency above this many ms before a "high
  # latency" alert fires (separate from a full outage).
  high_latency_threshold_ms: 200
  high_latency_occurrences: 5

speedtest:
  interval_minutes: 30
  provider: "ookla"
  # Alert if a completed speed test falls below these — 0 disables the check.
  min_download_mbps: 0
  min_upload_mbps: 0
  # Send a Telegram report after every completed speed test (not just
  # slow-speed alerts).
  report_enabled: true

retention:
  raw_data_days: 90
  cleanup_interval: 24h

logging:
  level: "info"
  path: ""

battery:
  # No-ops (never alerts, never errors) on hosts without a battery, so this
  # is safe to leave on for a typical always-on-AC home server.
  enabled: true
  low_threshold_pct: 50
  check_interval: 60s
